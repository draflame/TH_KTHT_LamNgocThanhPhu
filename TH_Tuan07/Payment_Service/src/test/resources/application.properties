spring.datasource.url=jdbc:h2:mem:payment_service_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sapassword

spring.jpa.hibernate.ddl-auto=create-drop
spring.kafka.listener.auto-startup=false
spring.kafka.bootstrap-servers=localhost:9092

app.kafka.topics.booking-created=booking.created
app.kafka.topics.payment-completed=payment.completed
app.kafka.topics.booking-failed=booking.failed


