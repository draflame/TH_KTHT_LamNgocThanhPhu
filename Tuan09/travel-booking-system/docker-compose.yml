version: '3.8'

services:
  # Người 3: User Service
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - NODE_ENV=development
    networks:
      - booking-network

  # Người 4: Tour Service
  tour-service:
    build:
      context: ./tour-service
      dockerfile: Dockerfile
    container_name: tour-service
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - NODE_ENV=development
    networks:
      - booking-network

  # Người 5: Booking Service
  booking-service:
    build:
      context: ./booking-payment-service
      dockerfile: Dockerfile.booking
    container_name: booking-service
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - NODE_ENV=development
    networks:
      - booking-network

  # Người 5: Payment Service
  payment-service:
    build:
      context: ./booking-payment-service
      dockerfile: Dockerfile.payment
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - NODE_ENV=development
    networks:
      - booking-network

  # Người 2: Orchestrator Service
  orchestrator-service:
    build:
      context: ./orchestrator-service
      dockerfile: Dockerfile
    container_name: orchestrator-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=development
      - USER_SERVICE_URL=http://user-service:8081
      - TOUR_SERVICE_URL=http://tour-service:8082
      - BOOKING_SERVICE_URL=http://booking-service:8083
      - PAYMENT_SERVICE_URL=http://payment-service:8084
    depends_on:
      - user-service
      - tour-service
      - booking-service
      - payment-service
    networks:
      - booking-network

  # Người 1: Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_ORCHESTRATOR_URL=http://localhost:8080
      - NODE_ENV=development
    depends_on:
      - orchestrator-service
    networks:
      - booking-network

networks:
  booking-network:
    driver: bridge
